<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Transformation Canvas — Consult Change Tool</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { honey:'#F4C362', 'deep-blue':'#0F172A', 'cc-purple':'#C985F0' }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
    .tab-content { display: none; opacity: 0; transition: opacity 0.3s ease-in-out; }
    .tab-content.active { display: block; opacity: 1; }
    .tab-btn.active { background-color: #0F172A; color: white; border-left: 4px solid #F4C362; }
    @media print { nav, footer, .no-print { display: none !important; } body { background-color: white; } }
  </style>
</head>
<body class="text-gray-900 antialiased">

  <nav class="bg-white/95 backdrop-blur fixed w-full z-50 border-b border-gray-100 no-print">
    <div class="container mx-auto px-5 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2 group">
        <img src="Consult change_sole logo_white.png" alt="Consult Change Icon" class="h-9 w-auto transition-transform group-hover:scale-105">
        <span class="font-bold text-xl tracking-tight text-deep-blue">Consult Change</span>
      </a>
      <div class="hidden md:flex items-center gap-6 font-semibold text-sm text-gray-600">
        <a href="index.html" class="hover:text-cc-purple transition">Home</a>
        <a href="ai_change.html" class="hover:text-cc-purple transition">AI Landing</a>
        <a href="meet_us.html" class="hover:text-cc-purple transition">Zespół</a>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="window.print()" class="hidden md:inline-flex items-center gap-2 px-4 py-2 bg-gray-100 text-deep-blue rounded-lg text-sm font-bold hover:bg-gray-200 transition">
          <i class="fa-solid fa-print"></i> PDF / Print
        </button>
      </div>
    </div>
  </nav>

  <header class="pt-28 pb-10 px-5 text-center bg-white border-b border-gray-200">
    <div class="container mx-auto max-w-4xl">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-purple-50 text-cc-purple text-xs font-bold mb-4 uppercase tracking-wider border border-purple-100">Internal Tool</div>
      <h1 class="text-3xl md:text-5xl font-extrabold text-deep-blue mb-4">AI Transformation Canvas</h1>
      <p class="text-lg text-gray-500 max-w-2xl mx-auto">Mapa drogowa Twojej zmiany. Użyj tego narzędzia do planowania warsztatów.</p>
    </div>
  </header>

  <main class="py-12 px-5">
    <div class="container mx-auto max-w-7xl">
      <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-200 flex flex-col lg:flex-row min-h-[700px]">
        <aside class="w-full lg:w-1/4 bg-gray-50 border-r border-gray-200 p-6">
          <h3 class="text-gray-400 font-bold uppercase text-xs tracking-widest mb-6">Etapy</h3>
          <nav class="space-y-2">
            <button onclick="openTab('t1')" class="tab-btn active w-full text-left p-4 rounded-xl transition font-semibold text-gray-700">1. Metodologia</button>
            <button onclick="openTab('t2')" class="tab-btn w-full text-left p-4 rounded-xl transition font-semibold text-gray-700">2. Dane & Bezpieczeństwo</button>
            <button onclick="openTab('t3')" class="tab-btn w-full text-left p-4 rounded-xl transition font-semibold text-gray-700">3. Governance</button>
            <button onclick="openTab('t4')" class="tab-btn w-full text-left p-4 rounded-xl transition font-semibold text-gray-700">4. Roadmapa & KPI</button>
          </nav>
        </aside>
        <div class="w-full lg:w-3/4 p-8 lg:p-12 bg-white">
          <div id="t1" class="tab-content active">
            <h2 class="text-3xl font-bold text-deep-blue mb-6">1. Metodologia</h2>
            <p>Tutaj treść o PROSCI i Agile...</p>
          </div>
          <div id="t2" class="tab-content"><h2 class="text-3xl font-bold">2. Dane</h2></div>
          <div id="t3" class="tab-content"><h2 class="text-3xl font-bold">3. Governance</h2></div>
          <div id="t4" class="tab-content"><h2 class="text-3xl font-bold">4. Roadmapa</h2></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function openTab(id) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.currentTarget.classList.add('active');
    }
  </script>
</body>
</html>
